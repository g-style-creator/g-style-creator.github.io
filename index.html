<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-STYLE 練習サイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f6f7f8;
      line-height: 1.7;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .hero {
      padding: 70px 24px;
      text-align: center;
      background: white;
    }

    .hero h1 {
      margin: 0 0 16px;
      font-size: 32px;
    }

    .hero p {
      color: #555;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      background: #222;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      max-width: 700px;
      margin: auto;
      padding: 50px 24px;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  G-STYLE
</header>

<section class="hero">
  <h1>暮らしの「困った」をお手伝い</h1>
  <p>
    運搬・家具移動・組み立てなど、<br>
    身近なお困りごとに対応します。
  </p>

  <a class="button" href="#service">
    サービスを見る
  </a>
</section>

<section class="section" id="service">

  <h2>サービス</h2>

  <div class="card">
    <h3>荷物の運搬</h3>
    <p>家具や荷物の運搬をお手伝いします。</p>
  </div>

  <div class="card">
    <h3>家具の組み立て</h3>
    <p>購入した家具の組み立ても対応します。</p>
  </div>

  <div class="card">
    <h3>その他のお手伝い</h3>
    <p>まずはお気軽にご相談ください。</p>
  </div>

</section>

<footer>
  © G-STYLE 練習サイト
</footer>

</body>
</html>
